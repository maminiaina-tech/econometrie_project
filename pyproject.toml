[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "econometrie-m1"
version = "1.0.0"
description = "Outil d'analyse econometrique avancee pour M1"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Emmanuel" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "sympy>=1.12",
    "fpdf2>=2.7",
    "python-docx>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
nlp = [
    "transformers>=4.30",
    "torch>=2.0",
    "pdfplumber>=0.10",
    "customtkinter>=5.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "mypy>=1.0",
]

[project.scripts]
econometrie = "econometrie_m1.app:main"
resume = "econometrie_m1.summarizer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/econometrie_m1"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (tkinter pattern)
    "SIM108", # ternary operator (readability)
    "N806",   # uppercase variable names (standard math notation: X, H, Q1, etc.)
    "N803",   # uppercase argument names (standard math notation)
    "B905",   # zip without strict= (not needed for internal use)
    "TC002",  # move third-party imports into type-checking (not practical here)
    "E722",   # bare except (legacy code, will be refactored)
    "B007",   # unused loop variable (legacy code, will be refactored)
]

[tool.ruff.lint.isort]
known-first-party = ["econometrie_m1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
